<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Investing Planner — Beginner Lesson</title>
<style>
:root {
  --navy: #0f2744;
  --blue: #2563eb;
  --blue-light: #3b82f6;
  --green: #059669;
  --amber: #d97706;
  --purple: #7c3aed;
  --red: #dc2626;
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --input-bg: #ffffff;
  --header-from: #0b1e33;
  --header-to: #164e78;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 10px 25px -5px rgb(15 39 68 / 0.12);
  --radius: 16px;
  --radius-sm: 10px;
}

[data-theme="dark"] {
  --navy: #e2e8f0;
  --bg: #0f172a;
  --card: #1e293b;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --line: #334155;
  --input-bg: #0f172a;
  --header-from: #020617;
  --header-to: #0f172a;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
  --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.4);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  transition: background 0.25s, color 0.25s;
}

header {
  padding: 48px 20px 40px;
  color: #fff;
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  position: relative;
}
.shell, main { max-width: 1140px; margin: 0 auto; }
main { padding: 24px 16px 70px; }

.theme-toggle {
  position: absolute;
  top: 18px;
  right: 18px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.theme-toggle:hover { background: rgba(255,255,255,0.25); }

.eyebrow {
  color: #93c5fd;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
h1 {
  max-width: 820px;
  margin: 0 0 12px;
  font-size: clamp(1.9rem, 4.8vw, 3.1rem);
  line-height: 1.15;
  font-weight: 800;
}
.hero-copy {
  max-width: 720px;
  color: #dbeafe;
  font-size: 1.1rem;
  margin: 0 0 20px;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.pill {
  padding: 6px 12px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-size: 0.82rem;
  font-weight: 500;
}

.notice {
  margin-bottom: 22px;
  padding: 14px 18px;
  background: #fffbeb;
  border: 1px solid #fcd34d;
  border-left: 5px solid #f59e0b;
  border-radius: var(--radius-sm);
  color: #78350f;
  font-size: 0.95rem;
}
[data-theme="dark"] .notice {
  background: #422006;
  border-color: #b45309;
  color: #fde68a;
}

.card {
  margin-bottom: 22px;
  padding: 26px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
h2 {
  margin: 0 0 6px;
  color: var(--navy);
  font-size: 1.4rem;
  font-weight: 750;
}
h3 { margin: 0 0 4px; color: var(--navy); font-size: 1.05rem; }
p { margin: 0 0 12px; }
.section-copy, .sub, .help, .fineprint { color: var(--muted); }

.grid { display: grid; gap: 18px; }
.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.input-card {
  overflow: hidden;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
}
.box-heading {
  display: flex;
  gap: 12px;
  padding: 16px 18px;
  background: color-mix(in srgb, var(--blue) 8%, transparent);
  border-bottom: 1px solid var(--line);
}
.contribution-card .box-heading { background: color-mix(in srgb, var(--green) 9%, transparent); }
.return-card .box-heading { background: color-mix(in srgb, var(--amber) 10%, transparent); }
.withdrawal-card .box-heading { background: color-mix(in srgb, var(--purple) 9%, transparent); }

.box-number, .step-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  font-weight: 800;
  font-size: 0.9rem;
  flex-shrink: 0;
}
.contribution-card .box-number { background: var(--green); }
.return-card .box-number { background: var(--amber); }
.withdrawal-card .box-number { background: var(--purple); }

.field { margin: 16px 18px; }
.field + .field { margin-top: 18px; }
label {
  display: block;
  margin-bottom: 6px;
  color: var(--navy);
  font-weight: 700;
  font-size: 0.92rem;
}
input {
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  color: var(--text);
  font: inherit;
  font-size: 1.05rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent);
}
input::placeholder { color: #94a3b8; opacity: 0.8; }
.help {
  margin: 8px 0 0;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 22px;
}
button {
  padding: 11px 18px;
  border: 0;
  border-radius: var(--radius-sm);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s, opacity 0.15s, background 0.15s;
}
button:active { transform: scale(0.98); }
.plain {
  background: color-mix(in srgb, var(--muted) 15%, transparent);
  color: var(--text);
}
.plain:hover { background: color-mix(in srgb, var(--muted) 25%, transparent); }
.primary {
  background: var(--blue);
  color: #fff;
}
.primary:hover { background: var(--blue-light); }
.sample-btn {
  background: color-mix(in srgb, var(--green) 15%, transparent);
  color: var(--green);
  border: 1.5px solid color-mix(in srgb, var(--green) 40%, transparent);
}
.sample-btn:hover { background: color-mix(in srgb, var(--green) 25%, transparent); }

/* Metrics */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.metric {
  min-height: 118px;
  padding: 16px 18px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.metric.blue { border-top: 4px solid var(--blue); }
.metric.green { border-top: 4px solid var(--green); }
.metric.amber { border-top: 4px solid var(--amber); }
.label {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.value {
  min-height: 32px;
  margin-top: 4px;
  color: var(--navy);
  font-size: clamp(1.25rem, 2.8vw, 1.7rem);
  font-weight: 800;
  letter-spacing: -0.02em;
}
.negative { color: var(--red) !important; }
.sub { font-size: 0.82rem; margin-top: 2px; }

/* Chart */
.chart-wrap {
  height: 340px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: color-mix(in srgb, var(--bg) 40%, transparent);
}
canvas { width: 100%; height: 100%; display: block; }
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 12px;
  font-size: 0.9rem;
  color: var(--muted);
}
.dot {
  display: inline-block;
  width: 11px;
  height: 11px;
  margin-right: 6px;
  border-radius: 50%;
  vertical-align: middle;
}
.dot.green { background: var(--green); }
.dot.blue { background: var(--blue); }

/* Goal */
.goal-area {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: end;
}
.result-callout, .callout {
  margin-top: 16px;
  padding: 15px 18px;
  border-radius: 12px;
  border: 1px solid #bfdbfe;
  background: #eff6ff;
  color: var(--text);
}
[data-theme="dark"] .result-callout,
[data-theme="dark"] .callout { background: #1e3a5f; border-color: #3b82f6; }
.result-callout.green, .callout.green {
  background: #ecfdf5;
  border-color: #6ee7b7;
}
[data-theme="dark"] .result-callout.green,
[data-theme="dark"] .callout.green { background: #064e3b; border-color: #34d399; }
.callout.amber {
  background: #fffbeb;
  border-color: #fcd34d;
  color: #78350f;
}
[data-theme="dark"] .callout.amber {
  background: #422006;
  border-color: #d97706;
  color: #fde68a;
}
.hidden { display: none !important; }

/* Table */
.table-wrap {
  max-height: 420px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
}
table {
  width: 100%;
  min-width: 680px;
  border-collapse: collapse;
  font-size: 0.9rem;
}
th, td {
  padding: 11px 14px;
  text-align: right;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}
th {
  position: sticky;
  top: 0;
  background: color-mix(in srgb, var(--blue) 8%, var(--card));
  color: var(--navy);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  z-index: 1;
}
th:first-child, td:first-child { text-align: left; }
tbody
